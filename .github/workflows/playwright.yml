          path: ${{ steps.findpath.outputs.task_dir }}/report.html

  docker-push-vasudevan:
    needs: test-vasudevan
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
