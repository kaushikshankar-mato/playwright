name: CI Pipeline - Run Changed Member Tests

on:
  pull_request:
    branches:
      - main

jobs:
  # DETECT
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      venkatramanan: ${{ steps.filter.outputs.venkatramanan }}
      arundeepak: ${{ steps.filter.outputs.arundeepak }}
      vasudevan: ${{ steps.filter.outputs.vasudevan }}
      vivek: ${{ steps.filter.outputs.vivek }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed folders
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: main
          filters: |
            venkatramanan:
              - 'python-tests/venkatramanan/**'
            arundeepak:
              - 'python-tests/arundeepak/**'
            vasudevan:
              - 'python-tests/vasudevan/**'
            vivek:
              - 'python-tests/vivek/**'

  # ARUNDEEPAK
  test-arundeepak:
    needs: detect-changes
    if: needs.detect-changes.outputs.arundeepak == 'true'
    runs-on: ubuntu-latest
    outputs:
      task_dir: ${{ steps.findpath.outputs.task_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find changed task folder
        id: findpath
        run: |
          CHANGED_FILE=$(git diff --name-only origin/main...HEAD | grep 'python-tests/arundeepak/' | head -n 1)
          echo "Changed file: $CHANGED_FILE"
          TASK_DIR=$(echo "$CHANGED_FILE" | cut -d'/' -f1-3)
          echo "task_dir=$TASK_DIR" >> $GITHUB_OUTPUT
          echo "Detected task folder: $TASK_DIR"

      - name: Install dependencies
        run: |
          cd ${{ steps.findpath.outputs.task_dir }}
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Start Toolshop app
        run: |
          git clone https://github.com/testsmith-io/practice-software-testing.git
          cd practice-software-testing
          docker compose up -d
          sleep 60
          docker compose exec -T laravel-api php artisan migrate:fresh --seed

      - name: Warm up Angular app (trigger compilation)
        run: |
          echo "Warming up frontend..."
          for i in {1..10}; do
            curl -s -o /dev/null -w "%{http_code}\n" http://localhost:4200 || echo "attempt $i failed"
            sleep 5
          done
          echo "Warm-up complete"

      - name: Run tests
        run: |
          cd ${{ steps.findpath.outputs.task_dir }}
          pytest test.py --html=report.html --self-contained-html -v

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arundeepak-report
          path: ${{ steps.findpath.outputs.task_dir }}/report.html

  docker-push-arundeepak:
    needs: test-arundeepak
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/toolshop-tests:arundeepak ${{ needs.test-arundeepak.outputs.task_dir }}
      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/toolshop-tests:arundeepak

  # VASUDEVAN
  test-vasudevan:
    needs: detect-changes
    if: needs.detect-changes.outputs.vasudevan == 'true'
    runs-on: ubuntu-latest
    outputs:
      task_dir: ${{ steps.findpath.outputs.task_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find changed task folder
        id: findpath
        run: |
          CHANGED_FILE=$(git diff --name-only origin/main...HEAD | grep 'python-tests/vasudevan/' | head -n 1)
          echo "Changed file: $CHANGED_FILE"
          TASK_DIR=$(echo "$CHANGED_FILE" | cut -d'/' -f1-3)
