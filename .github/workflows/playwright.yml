name: Playwright Tests (JS + Python)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  js-playwright-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers (JS)
        run: npx playwright install --with-deps

      - name: Run JS Playwright tests
        run: npx playwright test tests/test.spec.js

      - name: Upload JS Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-playwright-report
          path: playwright-report/
          retention-days: 30

  
  python-playwright-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pytest playwright pytest-playwright

      - name: Install Playwright Browsers (Python)
        run: python -m playwright install --with-deps chromium

      - name: Run pytest Playwright tests
        run: pytest test.py -v