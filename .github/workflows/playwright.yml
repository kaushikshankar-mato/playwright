        with:
          name: vivek-report
          path: ${{ steps.findpath.outputs.task_dir }}/report.html

  docker-push-vivek:
    needs: test-vivek
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/toolshop-tests:vivek ${{ needs.test-vivek.outputs.task_dir }}
      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/toolshop-tests:vivek

  # VENKATRAMANAN
  test-venkatramanan:
    needs: detect-changes
    if: needs.detect-changes.outputs.venkatramanan == 'true'
    runs-on: ubuntu-latest
    outputs:
      task_dir: ${{ steps.findpath.outputs.task_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find changed task folder
        id: findpath
        run: |
          CHANGED_FILE=$(git diff --name-only origin/main...HEAD | grep 'python-tests/venkatramanan/' | head -n 1)
          echo "Changed file: $CHANGED_FILE"
          TASK_DIR=$(echo "$CHANGED_FILE" | cut -d'/' -f1-3)
          echo "task_dir=$TASK_DIR" >> $GITHUB_OUTPUT
          echo "Detected task folder: $TASK_DIR"

      - name: Install dependencies
        run: |
          cd ${{ steps.findpath.outputs.task_dir }}
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Start Toolshop app
        run: |
          git clone https://github.com/testsmith-io/practice-software-testing.git
          cd practice-software-testing
          docker compose up -d

          echo "Waiting for MariaDB and running migrations..."
          for i in {1..12}; do
            if docker compose exec -T laravel-api php artisan migrate:fresh --seed; then
              echo "Database migrated and seeded successfully."
              break
            fi
            echo "Database not ready yet, retrying in 5s... ($i/12)"
            sleep 5
          done

          docker compose exec -T --user root laravel-api chmod -R 777 storage bootstrap/cache .env

      - name: Wait for API and Frontend readiness
        run: |
          echo "Waiting for API (port 8091) to return catalog data..."
          for i in {1..30}; do
            if curl -s http://localhost:8091/products | grep -q "id"; then
              echo "API is healthy and returning catalog data."
              break
            fi
            echo "API not ready yet, retrying in 5s... ($i/30)"
            sleep 5
          done

          echo "Waiting for Frontend (port 4200) to serve compiled app..."
          FRONTEND_READY=false
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Frontend is ready (HTTP 200)."
              FRONTEND_READY=true
              break
            fi
            echo "Frontend returned status $STATUS, retrying in 5s... ($i/30)"
            sleep 5
          done

          if [ "$FRONTEND_READY" = false ]; then
            echo "Frontend failed to start. Container logs:"
            cd practice-software-testing
            docker compose ps
            docker compose logs --tail=100
            exit 1
          fi

      - name: Verify application state before tests
        run: |
          cd practice-software-testing
          echo "===== Product count in DB ====="
          docker compose exec -T laravel-api php artisan tinker --execute="echo 'Products count: ' . App\Models\Product::count() . PHP_EOL;"

      - name: Run tests
        run: |
          cd ${{ steps.findpath.outputs.task_dir }}
          pytest test.py --html=report.html --self-contained-html -v

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venkatramanan-report
          path: ${{ steps.findpath.outputs.task_dir }}/report.html

  docker-push-venkatramanan:
    needs: test-venkatramanan
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/toolshop-tests:venkatramanan ${{ needs.test-venkatramanan.outputs.task_dir }}
      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/toolshop-tests:venkatramanan
