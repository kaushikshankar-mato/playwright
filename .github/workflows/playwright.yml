name: CI Pipeline - Unified Playwright Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'python-tests/**'
      - 'js-tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      task_dir: ${{ steps.detect.outputs.task_dir }}
      member: ${{ steps.detect.outputs.member }}
      lang: ${{ steps.detect.outputs.lang }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed task directory & language
        id: detect
        run: |
          CHANGED_FILE=$(git diff --name-only origin/main...HEAD | grep -E '^(python-tests|js-tests)/' | head -n 1)

          if [ -z "$CHANGED_FILE" ]; then
            echo "No test files changed in this PR."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          TASK_DIR=$(echo "$CHANGED_FILE" | cut -d'/' -f1-3)
          MEMBER=$(echo "$CHANGED_FILE" | cut -d'/' -f2)

          echo "task_dir=$TASK_DIR" >> $GITHUB_OUTPUT
          echo "member=$MEMBER" >> $GITHUB_OUTPUT
          echo "has_changes=true" >> $GITHUB_OUTPUT

          echo "Detected member: $MEMBER"
          echo "Detected task directory: $TASK_DIR"

          # Validate directory structure
          if [ ! -d "$TASK_DIR" ]; then
            echo "::error::Directory '$TASK_DIR' does not exist."
            exit 1
          fi

          # Detect language runtime
          if [ -f "$TASK_DIR/requirements.txt" ]; then
            echo "lang=python" >> $GITHUB_OUTPUT
            echo "Runtime: Python"
          elif [ -f "$TASK_DIR/package.json" ]; then
            echo "lang=js" >> $GITHUB_OUTPUT
            echo "Runtime: JavaScript/Node.js"
          else
            echo "::error::Directory '$TASK_DIR' must contain either requirements.txt or package.json"
            exit 1
          fi

      # ------------------- RUNTIME: PYTHON -------------------
      - name: Set up Python
        if: steps.detect.outputs.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & Playwright
        if: steps.detect.outputs.lang == 'python'
        run: |
          cd ${{ steps.detect.outputs.task_dir }}
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # ------------------- RUNTIME: NODE / JS -------------------
      - name: Set up Node.js
        if: steps.detect.outputs.lang == 'js'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS Dependencies & Playwright
        if: steps.detect.outputs.lang == 'js'
        run: |
          cd ${{ steps.detect.outputs.task_dir }}
          npm install
          npx playwright install --with-deps chromium

      # ------------------- TOOLSHOP CONTAINER SETUP -------------------
      - name: Start Toolshop App
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          git clone https://github.com/testsmith-io/practice-software-testing.git
          cd practice-software-testing
          docker compose up -d

          echo "Waiting for MariaDB and running migrations..."
          for i in {1..12}; do
            if docker compose exec -T laravel-api php artisan migrate:fresh --seed; then
              echo "Database seeded successfully."
              break
            fi
            echo "Database not ready, retrying in 5s... ($i/12)"
            sleep 5
          done

          docker compose exec -T --user root laravel-api chmod -R 777 storage bootstrap/cache .env

      - name: Wait for API and Frontend Readiness
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          echo "Waiting for API (port 8091) to return products..."
          for i in {1..30}; do
            if curl -s http://localhost:8091/products | grep -q "id"; then
              echo "API is healthy and catalog is populated."
              break
            fi
            echo "API not ready, retrying in 5s... ($i/30)"
            sleep 5
          done

          echo "Waiting for Frontend (port 4200) to serve compiled app..."
          FRONTEND_READY=false
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Frontend is ready (HTTP 200)."
              FRONTEND_READY=true
              break
            fi
            echo "Frontend status: $STATUS, retrying in 5s... ($i/30)"
            sleep 5
          done

          if [ "$FRONTEND_READY" = false ]; then
            echo "Frontend failed to start. Container logs:"
            cd practice-software-testing
            docker compose logs --tail=100
            exit 1
          fi

      # ------------------- TEST EXECUTION -------------------
      - name: Run Python Playwright Tests
        if: steps.detect.outputs.lang == 'python'
        run: |
          cd ${{ steps.detect.outputs.task_dir }}
          pytest test.py --html=report.html --self-contained-html -v

      - name: Run JavaScript Playwright Tests
        if: steps.detect.outputs.lang == 'js'
        run: |
          cd ${{ steps.detect.outputs.task_dir }}
          npx playwright test

      # ------------------- REPORT ARTIFACTS -------------------
      - name: Upload Test Report
        if: always() && steps.detect.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.detect.outputs.member }}-report
          path: |
            ${{ steps.detect.outputs.task_dir }}/report.html
            ${{ steps.detect.outputs.task_dir }}/playwright-report/
          if-no-files-found: ignore

  docker-push:
    needs: test
    if: success() && needs.test.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          TASK_DIR="${{ needs.test.outputs.task_dir }}"
          MEMBER="${{ needs.test.outputs.member }}"

          if [ ! -f "$TASK_DIR/Dockerfile" ]; then
            echo "No Dockerfile found in $TASK_DIR. Skipping image build."
            exit 0
          fi

          IMAGE_TAG="${{ secrets.DOCKER_USERNAME }}/toolshop-tests:${MEMBER}"
          echo "Building image $IMAGE_TAG from $TASK_DIR..."
          docker build -t "$IMAGE_TAG" "$TASK_DIR"

          echo "Pushing image to Docker Hub..."
          docker push "$IMAGE_TAG"
