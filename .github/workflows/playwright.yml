name: CI Pipeline - Run Changed Member Tests

on:
  pull_request:
    branches:
      - main

jobs:
  # ============ DETECT WHICH MEMBER'S FOLDER CHANGED ============
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      venkatramanan: ${{ steps.filter.outputs.venkatramanan }}
      arundeepak: ${{ steps.filter.outputs.arundeepak }}
      vasudevan: ${{ steps.filter.outputs.vasudevan }}
      vivek: ${{ steps.filter.outputs.vivek }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed folders
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: main
          filters: |
            venkatramanan:
              - 'python-tests/venkatramanan/**'
            arundeepak:
              - 'python-tests/arundeepak/**'
            vasudevan:
              - 'python-tests/vasudevan/**'
            vivek:
              - 'python-tests/vivek/**'

  # VENKATRAMANAN
  test-venkatramanan:
    needs: detect-changes
    if: needs.detect-changes.outputs.venkatramanan == 'true'
    runs-on: ubuntu-latest
    outputs:
      task_dir: ${{ steps.findpath.outputs.task_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find changed task folder
        id: findpath
        run: |
          CHANGED_FILE=$(git diff --name-only origin/main...HEAD | grep 'python-tests/venkatramanan/' | head -n 1)
          echo "Changed file: $CHANGED_FILE"
          TASK_DIR=$(echo "$CHANGED_FILE" | cut -d'/' -f1-3)
          echo "task_dir=$TASK_DIR" >> $GITHUB_OUTPUT
          echo "Detected task folder: $TASK_DIR"

      - name: Install Python dependencies
        run: |
          cd ${{ steps.findpath.outputs.task_dir }}
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Clone and start Toolshop app
        run: |
          git clone https://github.com/testsmith-io/practice-software-testing.git
          cd practice-software-testing
          docker compose up -d

      - name: Wait for MariaDB to be ready
        run: |
          cd practice-software-testing
          for i in {1..30}; do
            if docker compose exec -T mariadb mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MariaDB is ready"
              break
            fi
            echo "Waiting for MariaDB... ($i/30)"
            sleep 5
          done

      - name: Run migrations and seed database
        run: |
          cd practice-software-testing
          docker compose exec -T laravel-api php artisan migrate:fresh --seed

      - name: Verify data was seeded
        run: |
          cd practice-software-testing
          docker compose exec -T laravel-api php artisan tinker --execute="echo App\Models\Product::count();"

      - name: Wait for API to serve seeded data
        run: |
          for i in {1..20}; do
            RESPONSE=$(curl -s "http://localhost:8091/products?query=pliers" || echo "")
            if echo "$RESPONSE" | grep -qi "pliers"; then
              echo "API returning correct seeded data"
              break
            fi
            echo "Waiting for API data... ($i/20)"
            sleep 5
          done

      - name: Wait for frontend to be reachable
        run: |
          for i in {1..20}; do
            if curl -s http://localhost:4200 | grep -q "html"; then
              echo "Frontend is ready"
              break
            fi
            echo "Waiting for frontend... ($i/20)"
            sleep 5
          done

      - name: Run Playwright tests
        run: |
          cd ${{ steps.findpath.outputs.task_dir }}
          pytest test.py --html=report.html --self-contained-html -v

      - name: Docker logs (debug on failure)
        if: failure()
        run: |
          cd practice-software-testing
          echo "----- Laravel API logs -----"
          docker compose logs laravel-api --tail=50
          echo "----- Angular UI logs -----"
          docker compose logs angular-ui --tail=50
          echo "----- Container status -----"
          docker compose ps

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venkatramanan-report
          path: ${{ steps.findpath.outputs.task_dir }}/report.html

  docker-push-venkatramanan:
    needs: test-venkatramanan
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/toolshop-tests:venkatramanan ${{ needs.test-venkatramanan.outputs.task_dir }}

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/toolshop-tests:venkatramanan

  # ARUNDEEPAK 
  test-arundeepak:
    needs: detect-changes
    if: needs.detect-changes.outputs.arundeepak == 'true'
    runs-on: ubuntu-latest
    outputs:
      task_dir: ${{ steps.findpath.outputs.task_dir }}
    steps:
      - uses: actions/checkout@v4
