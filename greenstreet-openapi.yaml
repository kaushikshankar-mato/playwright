
openapi: 3.0.3

info:
  title: Competitor Pricing API
  description: API documentation for competitor pricing observations
  version: 1.0.0

servers:
  - url: https://tesco-api.greenstreet.com
    description: Tesco API server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TokenRequest:
      type: object
      required:
        - client_id
        - client_secret
        - grant_type
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        grant_type:
          type: string
          enum:
            - client_credentials

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
    UploadDatesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: string
            format: date

paths:
  /oauth/token:
    post:
      tags:
        - Authentication
      summary: Request access token
      description: Generate an access token using client credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Access token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid client credentials
        '404':
          description: File not found "{{baseUrl}}/oauth/toke"
        '422':
          description: Validation error

  /observations:
    get:
      tags:
        - Observations - 02
      summary: Get price observations
      description: Retrieve competitor pricing observations using optional filters.
      security:
        - bearerAuth: []
      parameters:
        - name: Basic Page - limit
          in: query
          description: Maximum number of records to return
          schema:
            type: integer
            minimum: 1
            default: 100
          example: 3

        - name: page two - offset
          in: query
          description: Number of records to skip
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 5

        - name: effective Date - start_date
          in: query
          description: Start of the effective date range
          schema:
            type: string
            format: date
          example: '2026-08-01'

        - name: effective Date - end_date
          in: query
          description: End of the effective date range
          schema:
            type: string
            format: date
          example: '2026-08-31'

        - name: competitor_id
          in: query
          description: Filter by competitor ID
          schema:
            type: integer
          example: 1

        - name: upload_date
          in: query
          description: Filter by upload date
          schema:
            type: string
            format: date

        - name: upload_date_start
          in: query
          description: Start of upload date range
          required: false
          schema:
            type: string
            format: date

        - name: upload_date_end
          in: query
          description: End of upload date range
          required: false
          schema:
            type: string
            format: date

        - name: X-Stream-Response
          in: header
          description: Set to true to request newline-delimited JSON
          required: false
          schema:
            type: boolean

      responses:
        '200':
          description: Observations retrieved successfully
          content:
            application/json:
            application/x-ndjson:
              schema:
                type: string
        '400':
          description: Bad request
        '401':
          description: Missing or invalid access token
        '404':
          description: Endpoint not found
        '405':
          description: HTTP method not allowed
        '422':
          description: Invalid query parameters or date range
        '429':
          description: Too many concurrent requests
  /upload-dates:
    get:
      summary: List upload dates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Upload dates returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadDatesResponse'
        '401':
          description: Unauthorized
        '422':
          description: Invalid request 

